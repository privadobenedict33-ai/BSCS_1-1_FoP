<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borrowed Memories</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--DON'T rename any id-->
  <div id="game">

    <!-- yo bro tupaz thiz The ONLY video. engine.js swaps its src for each scene. -->
    <video id="player" playsinline></video>

    <!-- Question overlay: hidden until a question starts. -->
    <div id="choice-layer" class="hidden">
      <p id="choice-prompt"></p>
      <!-- btw this is empty on purpose cuz: engine.js creates the A/B buttons here. -->
      <div id="choice-buttons"></div>
      <!-- Time bar: track + fill that shrinks, with seconds left. -->
      <div id="timebar">
        <div id="timebar-fill"></div>
      </div>
      <span id="timebar-text"></span>
    </div>

    <!-- Title screen:  -->
    <div id="title-screen" class="screen">
      <h1>Borrowed Memories</h1>
      <button id="play-btn" class="big-btn">Play</button>
      <!-- Hidden until a saved game exists. -->
      <button id="continue-btn" class="big-btn hidden">Continue</button>
    </div>

    <!-- Reusable message screen (Start button, endings). and Keep the h1 and p completely empty. -->
    <div id="message-screen" class="screen hidden">
      <h1 id="msg-title"></h1>
      <p id="msg-text"></p>
      <button id="msg-btn" class="big-btn"></button>
    </div>

  </div>

  <!-- and keep this in order brow: (story.js),  (engine.js), then checks (check.js). -->
  <script src="story.js"></script>
  <script src="engine.js"></script>
  <script src="check.js"></script>

</body>
</html>
